[project]
name = "training"
version = "0.1.0"
description = "Isolated unsloth (AMD/ROCm) training env — unsloth pins torch<2.12.0, incompatible with the root project's torch==2.13.0+rocm7.2, so kept separate (same pattern as serving/)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch==2.11.0+rocm7.2",
    "triton-rocm==3.6.0",
    "torchvision==0.26.0+rocm7.2",
    "unsloth[amd,studio]",
    "gguf>=0.19.0",
    "av>=18.0.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
