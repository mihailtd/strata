[project]
name = "runtime"
version = "0.1.0"
description = "Autonomous Runtime Engine with in-place weight folding, speculative decoding, and Riemannian dynamic routing"
authors = [
    { name = "Mihai Farcas", email = "farcasmihai91@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "kernels>=0.16.0",
    "matplotlib>=3.11.1",
    "pandas>=2.0,<3",
    "peft>=0.20.0",
    "protobuf>=6.31.1,<7.0.0",
    "pyyaml>=6.0.3",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "triton-rocm>=3.7.1",
    "trl>=1.9.2",
    "vllm>=0.23.1.dev1",
    "flash-attn>=2.8.3",
    "torchvision>=0.28.0",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "liger-kernel>=0.8.1",
    "sqlglot>=30.17.0",
    "py-pglite[extensions]>=0.5.3",
    "psycopg>=3.3.4",
    "pgvector>=0.5.0",
    "deepseek-harness-sdk",
    "runtime-common",
]

[project.scripts]
runtime = "runtime.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "apps"

[tool.uv]
environments = ["sys_platform == 'linux'"]
prerelease = "allow"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "vllm-rdna"
url = "https://rocm.frameworks.amd.com/whl-multi-arch/vllm-rdna"
explicit = true

[tool.uv.sources]
triton-rocm = [{ index = "pytorch-rocm" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm" }]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
vllm = { index = "vllm-rdna" }
flash-attn = { index = "vllm-rdna" }
runtime-common = { path = "apps/runtime-common", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
    "data",                               # vendored doc/repo clones (astral_docs raw sources)
    "apps/runtime-llama/llama.cpp",       # vendored upstream repo
    "mlruns",                             # MLflow artifact store, not source
    "evals/dsh_agent/runs",               # generated eval-run fixtures/transcripts
    "apps/runtime-common",                # independent uv project, own pyproject/venv/lint task
    "apps/runtime-triton",                # independent uv project, own pyproject/venv/lint task
    "apps/runtime-vllm",                  # independent uv project, own pyproject/venv/lint task
    "apps/factory",                       # independent uv project, own pyproject/venv/lint task
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
exclude = [
    "data",
    "apps/runtime-llama/llama.cpp",
    "mlruns",
    "evals/dsh_agent/runs",
    "apps/runtime-common",                # independent uv project, own pyproject/venv/deps
    "apps/runtime-triton",                # independent uv project, own pyproject/venv/deps
    "apps/runtime-vllm",                  # independent uv project, own pyproject/venv/deps
    "apps/factory",                       # independent uv project, own pyproject/venv/deps
]

[tool.pytest.ini_options]
testpaths = [
    "apps/runtime/tests",
    "apps/runtime-ipwf/tests",
    "apps/harness/tests",
    "apps/runtime-ollama/tests",
    "apps/runtime-llama/tests",
    "audit/tests",
    # Tests colocated with the experiments/benchmarks code they pin -- these
    # trees are otherwise excluded from recursive discovery (see
    # norecursedirs below) since they're runnable-script trees, not pytest
    # suites; an explicit path here still collects a named directory even
    # when an ancestor is excluded from recursion.
    "experiments/factory/geometry/latent_variable_glasso",
    "experiments/factory/geometry/poet_activation_crosstalk",
    "experiments/factory/geometry/poet_decomposition",
    "experiments/factory/geometry/activation_init_premise",
    "experiments/factory/geometry/riemannian_metric",
    "experiments/runtime/speculative/poet_temporal_compression",
    "benchmarks/factory/agentic/poet_tool_causal_graph",
    "benchmarks/multi_turn",
]
pythonpath = [".","apps"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
norecursedirs = [
    "data",
    "benchmarks",
    "experiments",
    "evals",
    "mlruns",
    "apps/runtime-common",
    "apps/runtime-triton",
    "apps/runtime-vllm",
    "apps/factory",
    "apps/runtime-llama/llama.cpp",
    "apps/runtime-next",
    "apps/dashboard",
]
addopts = "-v --tb=short"

[tool.pyright]
include = ["apps", "benchmarks", "experiments", "evals", "tests", "audit"]
exclude = [
    "apps/runtime-llama/llama.cpp",
    "apps/runtime-common",   # independent uv project, own pyproject/venv
    "apps/runtime-triton",   # independent uv project, own pyproject/venv
    "apps/runtime-vllm",     # independent uv project, own pyproject/venv
    "apps/factory",          # independent uv project, own pyproject/venv
    "apps/runtime-next",     # rust, not python
    "apps/dashboard",        # typescript, not python
]


