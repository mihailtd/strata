# DeepSeek Harness (dsh) Settings
# Configures the Primary Engine & Models Menu

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

llm-deepseek:
  baseURL: http://127.0.0.1:11434/v1
  apiKeyEnv: DEEPSEEK_API_KEY
  models:
    - id: "ornith-1.5:35b"
      name: "Ornith 1.5 35B MoE [Primary Agent Engine]"
      contextWindow: 32768
      maxTokens: 8192
    - id: "ornith-1.5:32k"
      name: "Ornith 1.5 35B MoE [32k Context Window]"
      contextWindow: 32768
      maxTokens: 8192
    - id: "qwen3.6:35b"
      name: "Qwen 3.6 35B MoE [Alibaba MoE]"
      contextWindow: 32768
      maxTokens: 8192
    - id: "qwen3.8:27b"
      name: "Qwen 3.8 27B [Dense Baseline]"
      contextWindow: 32768
      maxTokens: 8192

llm-pi-ai:
  providers:
    local-ollama:
      displayName: "Local ROCm MoE Engine"
      api: openai-completions
      baseURL: http://127.0.0.1:11434/v1
      apiKeyEnv: DEEPSEEK_API_KEY
      compat:
        thinkingFormat: deepseek
      models:
        - id: "ornith-1.5:35b"
          name: "Ornith 1.5 35B MoE [Primary Agent Engine]"
          contextWindow: 32768
          maxTokens: 8192
        - id: "ornith-1.5:32k"
          name: "Ornith 1.5 35B MoE [32k Context Window]"
          contextWindow: 32768
          maxTokens: 8192
        - id: "qwen3.6:35b"
          name: "Qwen 3.6 35B MoE"
          contextWindow: 32768
          maxTokens: 8192
