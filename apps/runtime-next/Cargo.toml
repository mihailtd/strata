[package]
name = "runtime-next"
version = "0.1.0"
edition = "2024"

# §105: which real Qwen3.5 size this binary is built for -- mutually
# exclusive, exactly one must be active (enforced by a compile-time
# assert in model.rs). Each selects a real, config.json-confirmed set of
# dims; everything NOT gated here (VOCAB_SIZE, head dims, RoPE theta, GDN
# structural dims) is identical across the whole real Qwen3.5 family and
# stays a single, ungated const.
[features]
default = ["qwen35_4b"]
qwen35_0_8b = []
qwen35_2b = []
qwen35_4b = []
qwen35_9b = []
# §106: Qwen3.8-27B -- same real hybrid GDN+attention architecture family
# (config-confirmed identical structural constants), just wider/deeper.
# Only tractable at all with quantization (bf16 needs ~54GB, more than
# this GPU has); this feature exists so the dense forward pass, weight
# loader, and correctness tests can target 27B's real shape ahead of the
# quantized kernel work.
qwen35_27b = []

[dependencies]
memmap2 = "0.9.11"
rand = "0.9"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
tokenizers = "0.23.2"
