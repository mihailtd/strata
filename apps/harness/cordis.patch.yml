# 1. Configure Default Model to runtime-next
- id: agent-default-model
  config:
    provider: runtime-next
    model: qwen3.5:9b-rust


# 2. Enable Native Subagent Tools
- id: tool-subagent
  disabled: false


- id: tool-subagent-fork
  disabled: false

- id: tool-subagent-control
  disabled: false

- id: tool-subagent-list-agents
  disabled: false

# 2. Mount Custom DSH Tool Plugins
- insert:
    - id: tool-code-verify
      name: '/home/mihai/Projects/gnn-experiment/apps/harness/plugins/dsh-plugin-code-verify/index.js'
      inject:
        - tools

    - id: tool-moa-router
      name: '/home/mihai/Projects/gnn-experiment/apps/harness/plugins/dsh-plugin-moa-router-tool/index.js'
      inject:
        - tools

    - id: infinite-agent
      name: '/home/mihai/Projects/gnn-experiment/apps/harness/plugins/dsh-plugin-infinite-agent/index.js'
      inject:
        - tools
