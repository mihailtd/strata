$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'python'
layer: 'library'
stack: 'backend'
tags: ['python', 'shared-root-venv', 'legacy']

# LEGACY: both serving paths this project used to be the only implementation
# of now have self-sufficient successors -- runtime-triton (27B W4A16,
# quantized) and runtime-ipwf (3B/9B, unquantized), each with its own
# pyproject.toml/uv.lock/.venv, depending only on runtime-common. Do not start
# apps/runtime/server.py for new work. This project is kept alive only as a
# shared module library: apps/factory still imports it via a sys.path
# bootstrap, and ~20 not-yet-migrated benchmarks/evals/tests still import
# symbols from it directly -- see apps/RUNTIME.md.
#
# Stage 1 state: apps/runtime has no manifest of its own yet -- it IS the
# root pyproject.toml's package (module-root = "apps" in the root
# pyproject.toml). A `root` moon project mapped to '.' was tried and reverted
# (see .moon/workspace.yml) because moon 2.5.4 does a pathological full-repo
# scan for a project whose source is the workspace root itself. So these
# tasks shell out to the root project explicitly instead; the wider
# lint/format/test/update-deps commands for benchmarks/experiments/evals/audit
# stay as plain `uv run` invocations from the repo root -- there's no more
# "Stage 4" this is progressing toward now that its serving role is retired;
# it stays on the shared root venv for as long as it remains a library.
dependsOn:
  - 'runtime-common'

tasks:
  test:
    command: 'uv run pytest tests -q'
  check-canon:
    command: 'uv run python ../../audit/check_canon.py'
  lint:
    command: 'uv run ruff check .'
  format:
    command: 'uv run ruff format .'
