$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'python'
layer: 'application'
stack: 'backend'
tags: ['shell-wrapper', 'runtime-engine']

# Pure shell wrapper around the external `ollama` binary -- zero Python/Node
# code of its own. `language: python` only drives the test task.
tasks:
  test:
    command: 'uv run pytest tests -q'
  lint:
    command: 'uv run ruff check tests'
  format:
    command: 'uv run ruff format tests'
  serve:
    command: './run_server.sh'
    preset: 'server'
