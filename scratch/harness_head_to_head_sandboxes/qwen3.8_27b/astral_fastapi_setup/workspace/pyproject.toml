[project]
name = "fastapi-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mihai Farcas", email = "farcasmihai91@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
fastapi-backend = "fastapi_backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
